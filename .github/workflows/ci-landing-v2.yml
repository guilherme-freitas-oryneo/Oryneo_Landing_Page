name: Verificar formulario ORYNEO v2
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript da landing
        run: |
          node --check assets/lead-intake.js
          node --check assets/quick-contact.js
          node --check assets/commercial.js
          node --check assets/company.js
          node --check comecar/form.js
          node --check comecar/intake-model.mjs
      - name: Testar formulário e transporte de leads
        run: node --test tests/*.test.mjs
      - name: Validar página progressiva e ativos públicos
        run: |
          test -s comecar/index.html
          test -s comecar/form.css
          test -s comecar/form.js
          test -s assets/oryneo-wordmark-mono-reverse.png
          test -s assets/oryneo-wordmark-official.png
          test -s assets/oryneo-symbol-official.svg
          grep -q 'href="../privacidade.html"' comecar/index.html
          grep -q 'oryneo-symbol-official.svg' comecar/index.html
          grep -q '/comecar/' sitemap.xml
      - name: Validar scripts incorporados e rotas comerciais
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('buildDirectCheckoutUrl')||!html.includes('buildCommercialUrl'))throw Error('Rotas comerciais ausentes');
          if((html.match(/data-plan-action=/g)||[]).length!==6)throw Error('CTAs dos três planos incompletos');
          if(html.includes('id="cnpj-form"')||html.includes('id="quick-form"'))throw Error('Formulário legado voltou à landing');
          const rx=/<script([^>]*)>([\s\S]*?)<\/script>/gi;
          let found=0,match;
          while((match=rx.exec(html))){
            if(match[1].includes('src=')||match[1].includes('application/ld+json'))continue;
            if(!match[2].trim())continue;
            new vm.Script(match[2]);found++;
          }
          console.log('Scripts inline verificados: '+found);
          JS
  public-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verificar páginas locais sem serviços reais
        run: |
          python3 -m http.server 8765 > /tmp/oryneo-public.log 2>&1 &
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/qa-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-responsive-qa
          path: qa-results/*.png
